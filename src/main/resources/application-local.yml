# Profile "local": matches gc-backend/local-dev/.env.example. DEV ONLY.
spring:
  datasource:
    password: ${DB_APP_PASSWORD:dev_case_app_pw}
gc:
  migration:
    owner-password: ${DB_OWNER_PASSWORD:dev_case_owner_pw}
    dev-seed: true
gc.security.cors-allowed-origins: http://localhost:5173
spring.data.redis.password: ${REDIS_PASSWORD:dev_redis_pw}
spring.security.oauth2.client.registration.iam.client-secret: ${IAM_CLIENT_SECRET:dev-case-service-secret}
springdoc.api-docs.enabled: true
springdoc.swagger-ui.enabled: true

# SPEC-CASE-05: SeaweedFS from local-dev (credentials in local-dev/seaweedfs/s3.json). DEV ONLY.
gc.attachments:
  endpoint: http://localhost:8333
  access-key: ${S3_ACCESS_KEY:gc-dev-access}
  secret-key: ${S3_SECRET_KEY:gc-dev-secret}
  sign-checksum: false   # SeaweedFS does not verify x-amz-checksum-sha256; the scan job re-checks SHA-256 (R105)
  create-buckets: true
